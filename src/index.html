<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mata Adentro</title>
<meta name="description" content="Jogo de plataforma 2D pela Mata Atlântica: cinco fases atrás das relíquias de ouro.">
<meta name="theme-color" content="#0d1410">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mata Adentro">
<meta name="format-detection" content="telephone=no">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; overscroll-behavior: none;
         -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; cursor: pointer; touch-action: none; }

  /* ---- celular: controles de toque (só aparecem com body.touch) ---- */
  body.touch, body.touch canvas { touch-action: none; }
  #touch { position: fixed; inset: 0; pointer-events: none; z-index: 5; display: none; }
  body.touch #touch { display: block; }
  #touch .tb { position: absolute; pointer-events: auto; touch-action: none; box-sizing: border-box;
               display: flex; align-items: center; justify-content: center;
               color: rgba(255, 236, 190, 0.92); font: 700 22px/1 system-ui, sans-serif;
               background: rgba(13, 20, 16, 0.38); border: 2px solid rgba(242, 193, 78, 0.55); }
  #touch .tb.on { background: rgba(242, 193, 78, 0.42); border-color: rgba(255, 220, 130, 0.95); }
  /* direcional: uma zona só; a direção vem da posição do polegar em relação ao centro */
  #pad { --s: min(40vh, 176px); width: var(--s); height: var(--s); border-radius: 50%;
         left: max(14px, calc(env(safe-area-inset-left) + 8px)); bottom: max(14px, calc(env(safe-area-inset-bottom) + 8px)); }
  #pad i { position: absolute; font-style: normal; opacity: 0.85; }
  #pad i.u { top: 9%; } #pad i.d { bottom: 9%; } #pad i.l { left: 11%; } #pad i.r { right: 11%; }
  #pad i.on { color: #fff; opacity: 1; text-shadow: 0 0 8px rgba(255, 210, 110, 0.9); }
  #pad b { position: absolute; width: 34%; height: 34%; border-radius: 50%; background: rgba(242, 193, 78, 0.22); border: 2px solid rgba(242, 193, 78, 0.5); }
  #jump { --s: min(28vh, 120px); width: var(--s); height: var(--s); border-radius: 50%; font-size: 15px; letter-spacing: 1px;
          right: max(18px, calc(env(safe-area-inset-right) + 10px)); bottom: max(20px, calc(env(safe-area-inset-bottom) + 12px)); }
  #pause, #fs { width: 46px; height: 46px; border-radius: 12px; font-size: 18px; top: var(--hudTop, 52px); }
  #pause { right: max(14px, calc(env(safe-area-inset-right) + 8px)); }
  #fs { left: max(14px, calc(env(safe-area-inset-left) + 8px)); display: none !important; }
  body.can-fs:not(.is-fs):not(.playing) #fs { display: flex !important; }
  body:not(.playing) #pad, body:not(.playing) #jump, body:not(.playing) #pause { visibility: hidden; }

  /* ---- retrato: pede para girar o celular ---- */
  #rotate { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
            background: #0d1410; color: #f2c14e; font: 700 20px/1.4 system-ui, sans-serif; text-align: center; padding: 24px; }
  #rotate svg { width: 92px; height: 92px; animation: girar 2.4s ease-in-out infinite; }
  #rotate small { color: #a9b8a0; font-weight: 400; font-size: 14px; max-width: 280px; }
  @keyframes girar { 0%, 25% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) { body.touch #rotate { display: flex; } }

  /* ---- Android: girou para paisagem (ou saiu da tela cheia) -> um toque volta para a tela cheia ---- */
  #fsgate { position: fixed; inset: 0; z-index: 8; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
            background: rgba(6, 10, 8, 0.82); color: #f2c14e; font: 700 26px/1.25 system-ui, sans-serif; text-align: center; padding: 24px;
            touch-action: none; cursor: pointer; }
  body.fs-gate #fsgate { display: flex; }
  #fsgate .ic { font-size: 54px; line-height: 1; animation: pulsar 1.4s ease-in-out infinite; }
  #fsgate button { margin-top: 10px; padding: 10px 16px; border: 0; background: none; color: #a9b8a0; font: 400 15px system-ui, sans-serif; text-decoration: underline; }
  @keyframes pulsar { 50% { transform: scale(1.12); } }

  /* ---- iPhone fora da Tela de Início: dica curta e fechável ---- */
  #ioshint { position: fixed; z-index: 9; left: 50%; top: max(12px, env(safe-area-inset-top)); transform: translateX(-50%); display: none;
             align-items: center; gap: 12px; width: max-content; max-width: min(700px, 92vw); padding: 8px 10px 8px 14px; border-radius: 14px;
             background: rgba(13, 20, 16, 0.94); border: 2px solid rgba(242, 193, 78, 0.7); color: #f4ecd2; font: 400 14px/1.35 system-ui, sans-serif; }
  body.ios-hint #ioshint { display: flex; }
  #ioshint b { color: #f2c14e; }
  #ioshint svg { flex: none; width: 26px; height: 26px; }
  #ioshint button { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(242, 193, 78, 0.2); color: #f2c14e; font: 700 18px system-ui, sans-serif; }
</style>
</head>
<body>
<canvas id="game" width="960" height="540" aria-label="Mata Adentro — jogo de plataforma"></canvas>
<div id="touch" aria-hidden="true">
  <div class="tb" id="pad"><b></b><i class="u">▲</i><i class="d">▼</i><i class="l">◀</i><i class="r">▶</i></div>
  <div class="tb" id="jump">PULAR</div>
  <div class="tb" id="pause">❚❚</div>
  <div class="tb" id="fs" title="Tela cheia">⛶</div>
</div>
<div id="fsgate" role="button" aria-label="Tocar para jogar em tela cheia">
  <div class="ic">⛶</div>
  <div>TOQUE PARA JOGAR<br>EM TELA CHEIA</div>
  <button type="button" id="fsgate-no">continuar sem tela cheia</button>
</div>
<div id="ioshint" role="note">
  <svg viewBox="0 0 24 24" fill="none" stroke="#f2c14e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>
  <div>Para jogar em <b>tela cheia</b>: toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>. Abra o jogo pelo ícone.</div>
  <button type="button" id="ioshint-x" aria-label="Fechar dica">✕</button>
</div>
<div id="rotate">
  <svg viewBox="0 0 64 64" fill="none" stroke="#f2c14e" stroke-width="4" stroke-linejoin="round"><rect x="20" y="6" width="24" height="52" rx="5"/><circle cx="32" cy="50" r="2.5" fill="#f2c14e"/></svg>
  <div>GIRE O CELULAR</div>
  <small>Mata Adentro se joga com o celular deitado.</small>
</div>
<script>
/*AUDIO*/
</script>
<script>
/*GAME*/
</script>
</body>
</html>
